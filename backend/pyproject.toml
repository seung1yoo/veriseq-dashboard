[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veriseq-dashboard-backend"
version = "0.1.0"
description = "VeriSeq Dashboard internal API and ingestion worker"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "pwdlib[argon2]>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
veriseq-api = "veriseq_dashboard.main:run"
veriseq-worker = "veriseq_dashboard.worker:run"
veriseq-seed = "veriseq_dashboard.seed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
